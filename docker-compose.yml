services:
  fintrack:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fintrack-app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./finance.db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./finance.db:/app/finance.db
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - fintrack-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: fintrack-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - fintrack-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

networks:
  fintrack-network:
    driver: bridge

volumes:
  redis_data:
    driver: local
