[project]
name = "test"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "sqlalchemy>=2.0.52",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.1",
    "redis>=8.1.0",
    "aiosqlite>=0.22.1",
    "alembic>=1.19.2",
]

[dependency-groups]
dev = [
    "ruff>=0.16.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0.0",
]

[tool.ruff.lint]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
